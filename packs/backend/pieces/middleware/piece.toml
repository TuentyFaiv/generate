schema_version = 1
name = "middleware"
description = "Middleware that propagates or creates a request header, e.g. `request-id`, and exposes it to handlers."
target = "src/shared/middleware"

[inputs.name]
type = "string"
description = "Header name without `x-`, e.g. `request-id` or `correlation-id`."
example = "RequestId"

[inputs.tests]
type = "bool"
description = "Add tests."
prompt = "Add tests?"
default = true

[[variants]]
name = "hono"
when = { framework = "hono", language = "typescript" }
files = "files/typescript"

[[variants]]
name = "express"
when = { framework = "express", language = "typescript" }
files = "files/typescript"

[[variants]]
name = "axum"
when = { framework = "axum" }
target = "src/middleware"

[[variants]]
name = "fastapi"
when = { framework = "fastapi" }
target = ""

[[variants]]
name = "chi"
when = { framework = "chi" }
files = "files/go"
target = "internal/middleware"

[[variants]]
name = "echo"
when = { framework = "echo" }
files = "files/go"
target = "internal/middleware"

[[files]]
path = "request-id.test.ts"
when = "tests"

[[files]]
path = "tests/middleware/test_request_id.py"
when = "tests"

[[files]]
path = "request_id_test.go"
when = "tests"

[[dependencies]]
ecosystem = "npm"
name = "vitest"
version = "^4.0"
dev = true
variants = ["hono", "express"]
when = "tests"

[[dependencies]]
ecosystem = "cargo"
name = "uuid"
version = "1"
features = ["v7"]
variants = ["axum"]

[[dependencies]]
ecosystem = "cargo"
name = "tokio"
version = "1"
features = ["macros", "rt-multi-thread"]
dev = true
variants = ["axum"]
when = "tests"

[[dependencies]]
ecosystem = "cargo"
name = "tower"
version = "0.5"
features = ["util"]
dev = true
variants = ["axum"]
when = "tests"

[[dependencies]]
ecosystem = "pypi"
name = "pytest"
version = ">=8"
dev = true
variants = ["fastapi"]
when = "tests"

[[dependencies]]
ecosystem = "pypi"
name = "httpx"
version = ">=0.28"
dev = true
variants = ["fastapi"]
when = "tests"

[[dependencies]]
ecosystem = "go"
name = "github.com/google/uuid"
version = "v1.6.0"
variants = ["chi", "echo"]
