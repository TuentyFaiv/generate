[workspace]
resolver = "3"
members = ["crates/*"]
# Everything except xtask, so plain `cargo run` resolves to the tfverse binary.
default-members = ["crates/tfverse", "crates/tfverse-core", "crates/tfverse-mcp", "crates/tfverse-packs"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Tonalli López <contact@tuentyfaiv.com>"]
repository = "https://github.com/TuentyFaiv/generate"
homepage = "https://cli.tuentyfaiv.com"

[workspace.dependencies]
tfverse-core = { path = "crates/tfverse-core", version = "=2.0.0-alpha.0" }
tfverse-packs = { path = "crates/tfverse-packs", version = "=2.0.0-alpha.0" }
tfverse-mcp = { path = "crates/tfverse-mcp", version = "=2.0.0-alpha.0" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
