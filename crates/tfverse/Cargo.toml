[package]
name = "tfverse"
description = "Generate projects and code from versioned, updatable packs, for humans and AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["cli", "scaffolding", "generator", "templates", "mcp"]
categories = ["command-line-utilities", "development-tools"]

# Keep in sync with `tfverse_core::brand::BINARY_NAME` (Cargo cannot read Rust constants).
[[bin]]
name = "tfverse"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tfverse-core.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true
